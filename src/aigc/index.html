    <link rel="shortcut icon" type="image/png" href="../assets/avatar.jpg" />
    <link rel="canonical" href="https://ioriens.com/aigc/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AIGC research archive and AI-assisted reports by Junjie."
    />
    <meta name="author" content="Junjie" />

    <style>
      :root {
        color-scheme: light;
        --bg: #f4f0e8;
        --panel: rgba(255, 252, 246, 0.74);
        --line: rgba(56, 45, 31, 0.14);
        --text: #1f1a17;
        --muted: #62584f;
        --accent: #176b5a;
        --accent-strong: #0f5144;
        --shadow: 0 20px 50px rgba(42, 31, 18, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(209, 219, 199, 0.7), transparent 30%),
          radial-gradient(circle at right 20%, rgba(214, 198, 170, 0.55), transparent 24%),
          var(--bg);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(980px, 100%);
        margin: 0 auto;
        padding: clamp(24px, 5vw, 56px) clamp(18px, 5vw, 48px)
          clamp(40px, 8vw, 72px);
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.45);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          color 180ms ease;
      }

      .back-link:hover,
      .back-link:focus-visible {
        color: var(--accent);
        border-color: rgba(23, 107, 90, 0.32);
        transform: translateY(-1px);
      }

      .hero {
        display: grid;
        gap: 16px;
        margin-top: clamp(28px, 6vw, 56px);
        margin-bottom: 28px;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua',
          Georgia, serif;
        font-size: clamp(2.6rem, 8vw, 4.6rem);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      .summary {
        margin: 0;
        max-width: 38rem;
        font-size: clamp(1rem, 2vw, 1.08rem);
        line-height: 1.75;
        color: var(--muted);
      }

      .report-list {
        display: grid;
        gap: 12px;
      }

      .report-link {
        display: grid;
        gap: 10px;
        padding: clamp(18px, 4vw, 24px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease;
      }

      .report-link:hover,
      .report-link:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(23, 107, 90, 0.38);
        background: rgba(255, 252, 247, 0.92);
      }

      .report-meta {
        margin: 0;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .report-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        font-size: clamp(1.2rem, 3vw, 1.7rem);
        font-weight: 700;
        line-height: 1.35;
      }

      .report-title span:first-child {
        min-width: 0;
      }

      .arrow {
        flex: 0 0 auto;
        color: var(--accent);
      }

      .report-note {
        margin: 0;
        max-width: 42rem;
        font-size: 0.98rem;
        line-height: 1.7;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .report-title {
          align-items: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>

        </a>

        <a
          class="report-link"
          href="2026-06-14-anthropic-vs-openai.html"

          <div class="report-title">
            <span>Anthropic × OpenAI · 系统级竞争对照</span>
            <span class="arrow" aria-hidden="true">→</span>

          <p class="report-note">系统级竞争对照，包含模型、产品、收入和生态相关内容。</p>
        </a>
      </main>
    </div>
